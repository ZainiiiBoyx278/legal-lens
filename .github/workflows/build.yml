name: Build checks
on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit --incremental false
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_TELEMETRY_DISABLED: '1'

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - name: Install locked CPU dependencies
        run: |
          TORCH_VERSION="$(sed -n 's/^torch==//p' requirements-lock.txt | tr -d '\r')"
          test -n "$TORCH_VERSION"
          python -m pip install --no-deps --index-url https://download.pytorch.org/whl/cpu "torch==$TORCH_VERSION"
          python -m pip install -r requirements-lock.txt
      - run: python -m pip check
      - name: Compile application source
        run: python -m compileall -q app run.py prepare_corpus.py scripts
      - name: Import API with a keyless configuration
        run: python -c "from app.main import app; assert app.title"
        env:
          OPENAI_API_KEY: ''
      - name: Run offline API and retrieval reliability tests
        run: python -m unittest discover -s tests -v
        env:
          OPENAI_API_KEY: ''
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
      - name: Validate Compose configuration
        working-directory: .
        run: docker compose config --quiet
